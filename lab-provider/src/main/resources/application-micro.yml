deployment:
  mode: micro

spring:
  application:
    name: lab-provider
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

dubbo:
  application:
    name: lab-provider
    register-mode: interface
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
  protocol:
    name: dubbo
    port: 20901
